# Har bir push'da avtomatik tekshiruv: ilova va server testlari.
# Qizil bo'lsa — o'sha versiyani chiqarmang (GitHub -> Actions'da sababi ko'rinadi).
name: Tekshiruv

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.44.0

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos lib test
      - run: flutter test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...
